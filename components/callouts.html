<!--
  COMPONENTE: Callouts / Alertas
  Uso: dentro do conteúdo de qualquer documento, para nota/dica/aviso/erro.
  4 variantes semânticas mapeadas para os tokens de estado do design system.
  Acessibilidade: role="note" genérico; ícone é decorativo (aria-hidden).
-->
<div class="callout callout--info" role="note">
  <span class="callout__icon" aria-hidden="true">ℹ️</span>
  <div><strong>Nota.</strong> Texto informativo de exemplo — placeholder estrutural do componente callout.</div>
</div>

<div class="callout callout--success" role="note">
  <span class="callout__icon" aria-hidden="true">✅</span>
  <div><strong>Confirmado.</strong> Texto de exemplo indicando uma decisão já validada.</div>
</div>

<div class="callout callout--warning" role="note">
  <span class="callout__icon" aria-hidden="true">⚠️</span>
  <div><strong>Atenção.</strong> Texto de exemplo indicando um ponto de risco ou pendência.</div>
</div>

<div class="callout callout--danger" role="note">
  <span class="callout__icon" aria-hidden="true">⛔</span>
  <div><strong>Crítico.</strong> Texto de exemplo indicando um bloqueio ou inconsistência grave.</div>
</div>
