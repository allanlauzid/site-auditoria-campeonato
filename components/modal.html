<!--
  COMPONENTE: Modal (usado especificamente para a busca global, mas genérico)
  Controlado por data-action="open-modal"/"close-modal" em navigation.js.
  Acessibilidade: role="dialog", aria-modal="true", aria-labelledby, foco
  preso visualmente pelo overlay; Escape fecha (ver navigation.js initModal).
-->
<div class="modal-overlay" id="search-modal" data-open="false">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="search-modal-title" tabindex="-1">
    <div class="modal__header">
      <h2 id="search-modal-title" style="margin:0;font-size:var(--fs-500)">Buscar</h2>
      <button type="button" class="modal__close" data-action="close-modal" aria-label="Fechar busca">×</button>
    </div>
    <!-- INCLUIR AQUI: components/search-bar.html -->
    <div class="search-bar" role="search">
      <span class="search-bar__icon" aria-hidden="true">🔍</span>
      <label for="modal-search-input" class="visually-hidden">Buscar na documentação</label>
      <input type="search" id="modal-search-input" data-search-input placeholder="Buscar documentos, termos, capítulos..." autocomplete="off" />
    </div>
    <div class="search-results" data-search-results aria-live="polite"></div>
  </div>
</div>
