<!--
  COMPONENTE: Header / Topbar
  Uso: incluído no topo de todas as páginas. Em vanilla JS/HTML puro (sem
  templating de servidor), este fragmento é copiado manualmente para cada
  página (ver templates/document-template.html) ou injetado via fetch()
  em builds futuros. data-topnav é preenchido dinamicamente por navigation.js
  a partir de /data/navigation.json.
  Acessibilidade: <header> semântico, nav com aria-label, botão de tema com
  aria-pressed, botão de menu mobile com aria-expanded/aria-controls.
-->
<header class="site-header">
  <div class="container site-header__inner">
    <a class="site-header__brand" href="/index.html">
      <img src="/assets/icons/logo-mark.svg" alt="" width="28" height="28" loading="eager" />
      <span>Portal CBKS</span>
    </a>

    <nav aria-label="Navegação principal">
      <ul class="site-header__nav" data-topnav>
        <!-- preenchido por navigation.js -->
      </ul>
    </nav>

    <div class="site-header__actions">
      <button type="button" class="btn btn--icon" data-action="open-modal" data-target="search-modal" aria-label="Abrir busca (Ctrl+K)"><svg class="icon icon-search" viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true" focusable="false"><circle cx="10" cy="10" r="6.25"/><line x1="14.6" y1="14.6" x2="20.25" y2="20.25"/></svg></button>
      <button type="button" class="btn btn--icon" data-action="toggle-theme" aria-pressed="false" aria-label="Alternar tema claro/escuro"><svg class="icon icon-theme" viewBox="0 0 24 24" width="36" height="36" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.75"/><path d="M12 4 A8 8 0 0 1 12 20 Z" fill="currentColor"/></svg></button>
      <button type="button" class="btn btn--icon" data-action="toggle-sidebar" aria-expanded="false" aria-controls="primary-sidebar" aria-label="Abrir menu de navegação"><svg class="icon icon-menu" viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" aria-hidden="true" focusable="false"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg></button>
    </div>
  </div>
</header>
