<!-- COMPONENTE: Tabs — controlado por navigation.js initTabs() -->
<div data-tabs>
  <div class="tabs__list" role="tablist" aria-label="Exemplo de abas">
    <button class="tabs__tab" role="tab" id="tab-1" aria-controls="panel-1" aria-selected="true">Visão geral</button>
    <button class="tabs__tab" role="tab" id="tab-2" aria-controls="panel-2" aria-selected="false" tabindex="-1">Dependências</button>
  </div>
  <div class="tabs__panel" id="panel-1" role="tabpanel" aria-labelledby="tab-1">Conteúdo da aba 1 (exemplo).</div>
  <div class="tabs__panel" id="panel-2" role="tabpanel" aria-labelledby="tab-2" hidden>Conteúdo da aba 2 (exemplo).</div>
</div>
